name: Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check custom_components/ tests/
        ruff format --check custom_components/ tests/

    - name: Run tests with coverage
      run: |
        pytest --cov=custom_components/unifi_network_rules --cov-report=term-missing --cov-report=xml --cov-fail-under=30

    - name: Coverage Report
      if: always()
      run: |
        echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "Coverage floor: 30% (enforced)" >> "$GITHUB_STEP_SUMMARY"
        if [ -f coverage.xml ]; then
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "See test output for coverage details" >> "$GITHUB_STEP_SUMMARY"
        fi
      
    - name: Report Status
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
          script: |
            const conclusion = '${{ job.status }}'.toLowerCase();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: conclusion === 'success' ? 'success' : 'failure',
              description: conclusion === 'success' ? 'All tests passed!' : 'Some tests failed.',
              context: 'Test Suite'
            });
